name: Keep Supabase Alive

# Supabase free-tier projects auto-pause after 7 days of inactivity.
# This workflow pings the project's REST API on a 5-day cadence (with
# margin under the 7-day window) to reset the inactivity timer.
# It can also be triggered manually from the Actions tab.

on:
  schedule:
    # Every 5 days at 08:00 UTC
    - cron: "0 8 */5 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://bqscfculigcgantgdjat.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Pinging $SUPABASE_URL/rest/v1/bookings ..."

          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            --max-time 30 \
            "${SUPABASE_URL}/rest/v1/bookings?select=id&limit=1")

          echo "HTTP status: $status"
          echo "Response body:"
          cat /tmp/body || true

          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "Keep-alive ping succeeded."
            exit 0
          else
            echo "::error::Keep-alive ping failed with HTTP $status."
            exit 1
          fi
